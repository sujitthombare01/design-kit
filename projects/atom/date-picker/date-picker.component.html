<label [for]="inputId" class="design-kit-atom-date-picker-label">{{ label() }}</label>
<div [class]="fieldClasses()">
  <input
    [id]="inputId"
    class="design-kit-atom-date-picker-control"
    [type]="type()"
    [value]="value()"
    [attr.min]="min() ?? null"
    [attr.max]="max() ?? null"
    [attr.readonly]="readonly() ? '' : null"
    [attr.required]="required() ? '' : null"
    [attr.aria-required]="required() ? 'true' : null"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    [disabled]="effectiveDisabled()"
    (input)="handleInput($event)"
    (blur)="handleBlur($event)"
  />
</div>
@if (invalid() && errorText()) {
  <p [id]="errorId" class="design-kit-atom-date-picker-error" role="alert">{{ errorText() }}</p>
} @else if (helperText()) {
  <p [id]="helperId" class="design-kit-atom-date-picker-helper">{{ helperText() }}</p>
}
